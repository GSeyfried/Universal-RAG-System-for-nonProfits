# config.yaml

# Where raw PDFs live
pdf_folder: "./pdfs"

# Root for all pipeline outputs
tmp_folder: "./tmp"

# Scripts to call (all relative to project root)
scripts:
  font_inspector:  "scripts/0_font_inspector.py"
  pdf_processor:   "scripts/1_pdf_processor.py"
  text_splitter:   "scripts/2_text_splitter.py"
  embedder:        "scripts/3_embedder.py"
  faiss_indexer:   "scripts/4_indexer.py"

openai:
  # default models
  embedding_model: "text-embedding-ada-002"
  llm_model:       "gpt-4.1-mini"

  # allow choice in the UI
  embedding_model_options:
    - "text-embedding-ada-002"
    - "text-embedding-ada-003"
    - "text-embedding-3-small"
  llm_model_options:
    - "gpt-4.1-mini"
    - "gpt-4o-latest"
    - "gpt-3.5-turbo"

cost:            
  text-embedding-ada-002:   0.0001  
  text-embedding-ada-003:   0.00013
  text-embedding-3-small:   0.00013

  gpt-3.5-turbo_prompt:     0.0015
  gpt-3.5-turbo_completion: 0.0020

  gpt-4.1-mini_prompt:      0.03
  gpt-4.1-mini_completion:  0.06

  gpt-4o-latest_prompt:     0.005
  gpt-4o-latest_completion: 0.015

rag:
  top_k: 5
